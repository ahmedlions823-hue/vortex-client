<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Client - TRAKXIS GAMES</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Splash Screen (شاشة التحميل الفضائية) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1c29 0%, #0b0f19 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .space-logo {
            font-size: 3rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .studio-name {
            font-size: 1.1rem;
            color: #8a99ad;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        .loader-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .loader-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #0077ff);
            box-shadow: 0 0 10px #00ffff;
            animation: loadProgress 2.5s forwards;
        }
        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* Main Launcher UI (واجهة اللانشر الرئيسية) */
        #launcher-main {
            display: none;
            width: 900px;
            height: 550px;
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header h1 {
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.4);
        }
        .content {
            display: flex;
            flex: 1;
            padding: 25px;
            gap: 25px;
        }
        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Client | TRAKXIS GAMES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #050515, #0b0f29, #1b143f);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .launcher-container {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            border-radius: 15px;
            padding: 40px;
            width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #00f0ff;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
        p.studio {
            color: #a5b4fc;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid #1e293b;
            color: #fff;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }
        select:focus, input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }
        .launch-btn {
            width: 100%;
            background: linear-gradient(90deg, #0284c7, #00f0ff);
            color: #000;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-shadow: none;
        }
        .launch-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="launcher-container">
        <h1>VORTEX CLIENT</h1>
        <p class="studio">BY TRAKXIS GAMES</p>
        
        <div class="input-group">
            <label>اسم اللاعب (Account)</label>
            <input type="text" id="username" placeholder="أدخل اسمك هنا..." value="Ahmed_Sfaa">
        </div>

        <div class="input-group">
            <label>اختر إصدار ماين كرافت (Minecraft Version)</label>
            <select id="version">
                <option value="1.21.5">Vortex 1.21.5 (Optimized)</option>
                <option value="1.21.4">Vortex 1.21.4</option>
                <option value="1.21.2">Vortex 1.21.2</option>
            </select>
        </div>

        <button class="launch-btn" onclick="launchGame()">تشغيل اللعبة (LAUNCH)</button>
    </div>

    <script>
        function launchGame() {
            const user = document.getElementById('username').value;
            const ver = document.getElementById('version').value;
            if(!user) {
                alert('الرجاء إدخال اسم اللاعب!');
                return;
            }
            alert('جاري إطلاق Vortex Client للإصدار ' + ver + ' للمستخدم ' + user + ' بنجاح! 🚀');
        }
    </script>
</body>
</html>
